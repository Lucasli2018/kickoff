<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-touch-icon" href="icons/icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/x-icon" href="icons/favicon.ico">
<title>起步 · 两分钟启动器</title>
<style>
:root{
  --bg:#f6f8f7; --surface:#ffffff; --ink:#1b2b2b; --sub:#6b7c79;
  --line:#e5ebe9; --brand:#0f766e; --brand-deep:#115e59; --brand-wash:#e8f4f1;
  --gold:#b98a2e; --danger:#b45454; --shadow:0 6px 22px rgba(15,60,55,.06);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  font-size:16px; line-height:1.55; -webkit-font-smoothing:antialiased;
}
button,input{font-family:inherit;font-size:16px}
button{cursor:pointer;border:0;background:none;color:inherit}
.app{max-width:520px;margin:0 auto;padding:0 18px calc(28px + env(safe-area-inset-bottom))}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;padding:22px 2px 14px}
.brand{display:flex;align-items:baseline;gap:8px}
.brand h1{margin:0;font-size:20px;font-weight:700;letter-spacing:.06em}
.brand small{color:var(--sub);font-size:11px;letter-spacing:.16em;text-transform:uppercase}
.streak-pill{display:flex;align-items:center;gap:6px;background:var(--brand-wash);color:var(--brand-deep);
  border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600}
.streak-pill .dot{width:7px;height:7px;border-radius:50%;background:var(--brand)}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);
  padding:22px;margin-bottom:14px}
.hero{padding-top:26px;padding-bottom:24px}
.hero h2{margin:0 0 6px;font-size:26px;line-height:1.3;font-weight:700;letter-spacing:-.01em}
.hero .lead{margin:0 0 22px;color:var(--sub);font-size:14px}
.field-label{display:block;font-size:13px;color:var(--sub);margin-bottom:8px}
.input-row{display:flex;gap:8px}
input[type=text]{flex:1;min-width:0;height:50px;padding:0 15px;border:1px solid var(--line);border-radius:13px;
  background:#fafcfb;color:var(--ink);outline:none;transition:border-color .18s,box-shadow .18s}
input[type=text]:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-wash)}
input::placeholder{color:#a6b3b0}
.quick{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 20px}
.chip{border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;color:var(--sub);
  transition:all .15s}
.chip:active,.chip.on{background:var(--brand-wash);border-color:var(--brand);color:var(--brand-deep)}
.launch{width:100%;height:56px;border-radius:15px;background:var(--brand);color:#fff;font-size:17px;
  font-weight:600;letter-spacing:.05em;box-shadow:0 6px 16px rgba(15,118,110,.22);transition:transform .12s,background .15s}
.launch:active{transform:scale(.98);background:var(--brand-deep)}
.hint{text-align:center;color:var(--sub);font-size:12px;margin-top:10px}

/* stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:0}
.stat{text-align:center;position:relative}
.stat+.stat:before{content:"";position:absolute;left:0;top:6px;bottom:6px;width:1px;background:var(--line)}
.stat .num{font-size:26px;font-weight:700;line-height:1.2;font-variant-numeric:tabular-nums}
.stat .cap{font-size:12px;color:var(--sub);margin-top:2px}
.lv-line{display:flex;justify-content:space-between;align-items:center;padding-top:16px;margin-top:16px;border-top:1px solid var(--line)}
.lv-name{font-size:13px;font-weight:600;color:var(--brand-deep)}
.lv-pt{font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums}
.bar{height:5px;border-radius:99px;background:var(--line);margin-top:9px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--brand);border-radius:99px;transition:width .4s}

/* section title */
.sec-title{display:flex;align-items:center;justify-content:space-between;margin:0 0 16px}
.sec-title h3{margin:0;font-size:14px;font-weight:600;letter-spacing:.04em}
.sec-title span{font-size:12px;color:var(--sub)}

/* badges */
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 8px}
.badge{text-align:center;opacity:.42;transition:opacity .2s}
.badge.on{opacity:1}
.badge-ic{width:46px;height:46px;margin:0 auto 7px;border-radius:14px;display:flex;align-items:center;justify-content:center;
  background:var(--bg);border:1px solid var(--line);font-size:20px;color:var(--sub)}
.badge.on .badge-ic{background:var(--brand-wash);border-color:transparent;color:var(--brand)}
.badge-n{font-size:12px;font-weight:600}
.badge-d{font-size:10px;color:var(--sub);line-height:1.4;margin-top:1px}

/* records */
.rec{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--line)}
.rec:last-child{border-bottom:0;padding-bottom:0}
.rec:first-child{padding-top:0}
.rec-dot{width:8px;height:8px;border-radius:50%;background:var(--brand);flex:none;opacity:.75}
.rec-body{flex:1;min-width:0}
.rec-task{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rec-meta{font-size:11px;color:var(--sub);margin-top:1px}
.rec-pt{font-size:12px;color:var(--brand);font-weight:600}
.empty{color:var(--sub);font-size:13px;text-align:center;padding:14px 0}

/* footer */
.foot{display:flex;justify-content:center;gap:18px;flex-wrap:wrap;padding:6px 0 20px}
.foot button{font-size:12px;color:var(--sub);text-decoration:underline;text-underline-offset:3px}
.foot button.arm{color:var(--danger)}
.foot .quote{width:100%;text-align:center;color:#9aa8a4;font-size:12px;margin-bottom:4px}
.hide{display:none!important}

/* focus overlay */
.focus{position:fixed;inset:0;z-index:50;background:#f6f8f7;display:none;align-items:center;justify-content:center;
  padding:24px;text-align:center}
.focus.show{display:flex}
.focus-inner{width:100%;max-width:360px}
.ring-wrap{position:relative;width:260px;height:260px;margin:0 auto 8px}
.ring-wrap svg{transform:rotate(-90deg)}
.ring-bg{fill:none;stroke:#e5ebe9;stroke-width:11}
.ring-fg{fill:none;stroke:var(--brand);stroke-width:11;stroke-linecap:round;transition:stroke-dashoffset .25s linear}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-center .time{font-size:52px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:.02em;line-height:1}
.ring-center .lab{font-size:12px;color:var(--sub);margin-top:8px;letter-spacing:.1em}
.f-task{font-size:15px;font-weight:600;margin:14px 0 30px;color:var(--ink);
  max-width:300px;margin-left:auto;margin-right:auto;word-break:break-word}
.f-btn{width:100%;height:54px;border-radius:15px;background:var(--brand);color:#fff;font-size:16px;font-weight:600;
  box-shadow:0 6px 16px rgba(15,118,110,.2);margin-bottom:12px}
.f-btn.ghost{background:transparent;color:var(--sub);box-shadow:none;font-weight:400;font-size:14px;height:40px;margin:0}
.check{width:74px;height:74px;border-radius:50%;background:var(--brand-wash);color:var(--brand);
  display:flex;align-items:center;justify-content:center;margin:0 auto 22px;font-size:36px}
.d-title{font-size:24px;font-weight:700;margin:0 0 6px}
.d-sub{font-size:14px;color:var(--sub);margin:0 0 4px}
.d-time{font-size:12px;color:var(--brand);margin-bottom:30px}

/* confetti + toast */
.cf{position:fixed;width:8px;height:8px;border-radius:2px;pointer-events:none;z-index:90;animation:burst 1.2s ease-out forwards}
@keyframes burst{0%{transform:translate(0,0) rotate(0);opacity:1}100%{transform:translate(var(--dx),var(--dy)) rotate(540deg);opacity:0}}
.toast{position:fixed;left:50%;bottom:32px;transform:translate(-50%,20px);z-index:95;background:#1b2b2b;color:#fff;
  font-size:13px;padding:11px 18px;border-radius:12px;opacity:0;transition:all .25s;pointer-events:none;max-width:88vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="brand"><h1>起步</h1><small>Kickoff</small></div>
    <div class="streak-pill"><span class="dot"></span><span>连续 <b id="sTop">0</b> 天</span></div>
  </div>

  <section class="card hero">
    <h2>先做两分钟。</h2>
    <p class="lead" id="lead">拖延的人不缺计划，只缺一个开始。</p>
    <label class="field-label" for="taskInput">此刻，只要做一件小事</label>
    <div class="input-row">
      <input id="taskInput" type="text" maxlength="40" placeholder="例如：打开文档，写第一行">
    </div>
    <div class="quick" id="quick">
      <button class="chip" data-v="回一封消息">回一封消息</button>
      <button class="chip" data-v="写第一行">写第一行</button>
      <button class="chip" data-v="读一页书">读一页书</button>
      <button class="chip" data-v="收拾桌面">收拾桌面</button>
    </div>
    <button class="launch" id="launchBtn">启动 2 分钟</button>
    <div class="hint">不要求做完，只要开始。</div>
  </section>

  <section class="card">
    <div class="stats">
      <div class="stat"><div class="num" id="sStreak">0</div><div class="cap">连续天数</div></div>
      <div class="stat"><div class="num" id="sTotal">0</div><div class="cap">累计启动</div></div>
      <div class="stat"><div class="num" id="sToday">0</div><div class="cap">今日启动</div></div>
    </div>
    <div class="lv-line">
      <span class="lv-name" id="lvName">Lv.1 起步者</span>
      <span class="lv-pt"><b id="sPoints">0</b> 分</span>
    </div>
    <div class="bar"><i id="lvBar" style="width:0%"></i></div>
  </section>

  <section class="card">
    <div class="sec-title"><h3>成就徽章</h3><span id="achCount">0 / 6</span></div>
    <div class="badges" id="badges"></div>
  </section>

  <section class="card">
    <div class="sec-title"><h3>最近启动</h3><span>每次开始都算数</span></div>
    <div id="history"></div>
  </section>

  <div class="foot">
    <div class="quote">完成就打勾，没完成也没关系。</div>
    <button id="soundBtn">提示音：开</button>
    <button id="installBtn" class="hide">安装到主屏幕</button>
    <button id="resetBtn">清空数据</button>
  </div>
</div>

<div class="focus" id="focus">
  <div class="focus-inner">
    <div id="runPanel">
      <div class="ring-wrap">
        <svg width="260" height="260" viewBox="0 0 260 260">
          <circle class="ring-bg" cx="130" cy="130" r="113"></circle>
          <circle class="ring-fg" id="ringFg" cx="130" cy="130" r="113"></circle>
        </svg>
        <div class="ring-center"><div class="time" id="fTime">02:00</div><div class="lab">只管开始</div></div>
      </div>
      <div class="f-task" id="fTask"></div>
      <button class="f-btn" id="doneEarlyBtn">我完成了</button>
      <button class="f-btn ghost" id="giveUpBtn">放弃</button>
    </div>
    <div id="donePanel" class="hide">
      <div class="check">✓</div>
      <h3 class="d-title" id="dTitle">2 分钟到了</h3>
      <p class="d-sub" id="dSub">刚才这段时间，做到了吗？</p>
      <div class="d-time" id="dTime"></div>
      <button class="f-btn" id="commitBtn">做到了 · +10 分</button>
      <button class="f-btn" id="againBtn" style="background:var(--brand-wash);color:var(--brand-deep);box-shadow:none">再来 2 分钟</button>
      <button class="f-btn ghost" id="endBtn">结束</button>
    </div>
  </div>
</div>

<div id="confetti"></div>
<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";
  var KEY = "kickoff_data_v1";
  var LIMIT = 120;
  var CIRC = 2 * Math.PI * 113;
  var DEF = { points:0, total:0, streak:0, best:0, lastDate:"", today:{date:"",count:0}, history:[], ach:[], sound:true };
  var S;
  try { S = Object.assign({}, DEF, JSON.parse(localStorage.getItem(KEY) || "{}")); }
  catch(e) { S = Object.assign({}, DEF); }
  if (!S.today || typeof S.today !== "object") S.today = {date:"",count:0};
  if (!Array.isArray(S.history)) S.history = [];
  if (!Array.isArray(S.ach)) S.ach = [];

  var ACH = [
    {id:"first", n:"破冰", d:"第一次启动", s:"✦"},
    {id:"three", n:"三连", d:"连续 3 天", s:"◆"},
    {id:"week",  n:"一周", d:"连续 7 天", s:"▲"},
    {id:"ten",   n:"行动派", d:"累计 10 次", s:"●"},
    {id:"fifty", n:"惯行", d:"累计 50 次", s:"■"},
    {id:"early", n:"晨起", d:"6–9 点启动", s:"✳"}
  ];
  var LV = ["起步者","行动者","坚持者","破拖延者","时间主人","从容者"];

  function $(id){ return document.getElementById(id); }
  function pad(n){ return String(n).padStart(2,"0"); }
  function dstr(d){ d = d || new Date(); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
  function parseD(s){ var a = String(s).split("-").map(Number); return new Date(a[0], a[1]-1, a[2]); }
  function diffDays(a,b){ if(!a) return 999; return Math.round((parseD(b)-parseD(a))/86400000); }
  function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]; }); }
  function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

  function levelInfo(){
    var lv = Math.min(LV.length, 1 + Math.floor(S.points/100));
    return { lv:lv, name:LV[lv-1], cur:S.points - (lv-1)*100, span:lv < LV.length ? 100 : 100 };
  }

  function checkAch(){
    var map = {
      first:S.total>=1, three:S.best>=3, week:S.best>=7,
      ten:S.total>=10, fifty:S.total>=50,
      early:(new Date().getHours()>=6 && new Date().getHours()<9)
    };
    var got = [];
    ACH.forEach(function(a){ if(map[a.id] && S.ach.indexOf(a.id)<0){ S.ach.push(a.id); got.push(a); } });
    return got;
  }

  function markDone(task, sec){
    var t = dstr();
    if (S.lastDate !== t){
      S.streak = diffDays(S.lastDate, t) === 1 ? S.streak + 1 : 1;
      S.lastDate = t;
      if (S.streak > S.best) S.best = S.streak;
    }
    S.total++; S.points += 10;
    if (S.today.date !== t) S.today = {date:t, count:1}; else S.today.count++;
    S.history.unshift({t:Date.now(), task:task || "一次启动", sec:sec});
    S.history = S.history.slice(0, 40);
    var got = checkAch();
    save(); render();
    return got;
  }

  function render(){
    var t = dstr();
    $("sTop").textContent = S.streak;
    $("sStreak").textContent = S.streak;
    $("sTotal").textContent = S.total;
    $("sToday").textContent = S.today.date === t ? S.today.count : 0;
    $("sPoints").textContent = S.points;
    var li = levelInfo();
    $("lvName").textContent = "Lv." + li.lv + " " + li.name;
    $("lvBar").style.width = Math.min(100, li.cur) + "%";
    $("achCount").textContent = S.ach.length + " / " + ACH.length;

    $("badges").innerHTML = ACH.map(function(a){
      var on = S.ach.indexOf(a.id) >= 0;
      return '<div class="badge '+(on?"on":"")+'"><div class="badge-ic">'+a.s+'</div>'+
             '<div class="badge-n">'+a.n+'</div><div class="badge-d">'+a.d+'</div></div>';
    }).join("");

    var list = S.history.slice(0,5);
    $("history").innerHTML = list.length ? list.map(function(h){
      var d = new Date(h.t);
      var dur = h.sec >= 120 ? "2 分钟以上" : Math.max(1, Math.round(h.sec/60)) + " 分钟";
      return '<div class="rec"><span class="rec-dot"></span><div class="rec-body">'+
             '<div class="rec-task">'+esc(h.task)+'</div>'+
             '<div class="rec-meta">'+pad(d.getMonth()+1)+'/'+pad(d.getDate())+' '+pad(d.getHours())+':'+pad(d.getMinutes())+' · '+dur+'</div>'+
             '</div><span class="rec-pt">+10</span></div>';
    }).join("") : '<div class="empty">还没有记录，写下第一件小事吧。</div>';
  }

  // browser tab icon: static by default, live countdown ring while running
  var favLinks = document.querySelectorAll('link[rel="icon"]');
  var favLink = favLinks.length ? favLinks[0] : null;
  var favCanvas = document.createElement("canvas");
  favCanvas.width = favCanvas.height = 64;
  var fctx = favCanvas.getContext("2d");
  var lastFavLeft = -1;

  function setFavicon(href){ if (favLink) favLink.href = href; }
  function roundRect(ctx,x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }
  function drawFavicon(left){
    if (left === lastFavLeft) return;
    lastFavLeft = left;
    var c = fctx;
    c.clearRect(0,0,64,64);
    c.fillStyle = "#0f766e";
    roundRect(c, 3, 3, 58, 58, 14);
    c.fill();
    c.strokeStyle = "rgba(255,255,255,.28)";
    c.lineWidth = 6;
    c.beginPath(); c.arc(32,32,19,0,Math.PI*2); c.stroke();
    var ratio = Math.max(0, Math.min(1, left / LIMIT));
    if (ratio > 0){
      c.strokeStyle = "#ffffff";
      c.lineWidth = 6;
      c.lineCap = "round";
      c.beginPath();
      c.arc(32,32,19, -Math.PI/2, -Math.PI/2 + Math.PI*2*ratio);
      c.stroke();
    }
    c.fillStyle = "#ffffff";
    c.font = "bold 20px -apple-system, Arial, sans-serif";
    c.textAlign = "center";
    c.textBaseline = "middle";
    c.fillText(String(left), 32, 33);
    setFavicon(favCanvas.toDataURL("image/png"));
  }
  function resetFavicon(){ lastFavLeft = -1; setFavicon("favicon.svg"); }

  var toastT;
  function toast(msg){
    var el = $("toast"); el.textContent = msg; el.classList.add("show");
    clearTimeout(toastT); toastT = setTimeout(function(){ el.classList.remove("show"); }, 2400);
  }
  function ding(){
    if (!S.sound) return;
    try{
      var AC = window.AudioContext || window.webkitAudioContext;
      var ctx = new AC();
      var o = ctx.createOscillator(), g = ctx.createGain();
      o.type = "sine";
      o.frequency.setValueAtTime(880, ctx.currentTime);
      o.frequency.exponentialRampToValueAtTime(1320, ctx.currentTime + 0.12);
      g.gain.setValueAtTime(0.12, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.55);
      o.connect(g); g.connect(ctx.destination); o.start(); o.stop(ctx.currentTime + 0.56);
      setTimeout(function(){ ctx.close(); }, 750);
    }catch(e){}
  }
  function dingEnd(){
    if (!S.sound) return;
    try{
      var AC = window.AudioContext || window.webkitAudioContext;
      var ctx = new AC();
      [0, 0.18].forEach(function(delay, i){
        var o = ctx.createOscillator(), g = ctx.createGain();
        o.type = "sine";
        o.frequency.value = i === 0 ? 660 : 880;
        g.gain.setValueAtTime(0.0001, ctx.currentTime + delay);
        g.gain.exponentialRampToValueAtTime(0.12, ctx.currentTime + delay + 0.02);
        g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + delay + 0.35);
        o.connect(g); g.connect(ctx.destination);
        o.start(ctx.currentTime + delay);
        o.stop(ctx.currentTime + delay + 0.36);
      });
      setTimeout(function(){ ctx.close(); }, 900);
    }catch(e){}
  }

  function celebrate(){
    var box = $("confetti");
    var colors = ["#0f766e","#5eead4","#b98a2e","#9ab3ae","#ffffff"];
    for (var i=0;i<28;i++){
      (function(i){
        var el = document.createElement("i");
        el.className = "cf";
        el.style.left = (42 + Math.random()*16) + "%";
        el.style.top = "42%";
        el.style.background = colors[i % colors.length];
        var a = Math.random()*Math.PI*2, dist = 90 + Math.random()*190;
        el.style.setProperty("--dx", (Math.cos(a)*dist).toFixed(0)+"px");
        el.style.setProperty("--dy", (Math.sin(a)*dist - 60).toFixed(0)+"px");
        el.style.animationDelay = (Math.random()*0.12).toFixed(2)+"s";
        box.appendChild(el);
        setTimeout(function(){ el.remove(); }, 1500);
      })(i);
    }
  }

  var timer = { phase:"idle", endAt:0, startAt:0, task:"", sec:0, raf:0 };
  function startFocus(){
    var task = $("taskInput").value.trim();
    timer.task = task;
    timer.phase = "run";
    timer.startAt = Date.now();
    timer.endAt = timer.startAt + LIMIT*1000;
    $("fTask").textContent = task || "就现在，先开始";
    $("runPanel").classList.remove("hide");
    $("donePanel").classList.add("hide");
    $("focus").classList.add("show");
    $("ringFg").style.strokeDasharray = CIRC.toFixed(1);
    tick();
  }
  function tick(){
    if (timer.phase !== "run") return;
    var left = Math.max(0, Math.ceil((timer.endAt - Date.now())/1000));
    var ratio = left / LIMIT;
    $("fTime").textContent = pad(Math.floor(left/60)) + ":" + pad(left%60);
    $("ringFg").style.strokeDashoffset = (CIRC * (1-ratio)).toFixed(1);
    drawFavicon(left);
    if (left <= 0) showDone(true);
    else timer.raf = requestAnimationFrame(tick);
  }
  function showDone(natural){
    timer.phase = "done";
    cancelAnimationFrame(timer.raf);
    resetFavicon();
    if (natural) dingEnd();
    timer.sec = natural ? LIMIT : Math.max(1, Math.round((Date.now()-timer.startAt)/1000));
    $("runPanel").classList.add("hide");
    $("donePanel").classList.remove("hide");
    $("dTitle").textContent = natural ? "2 分钟到了" : "很好，你开始了";
    $("dSub").textContent = natural ? "刚才这段时间，做到了吗？" : "哪怕只有一小步，也算数。";
    $("dTime").textContent = natural ? "完整 2 分钟 · +10 分" : "已用 " + timer.sec + " 秒 · +10 分";
  }
  function closeFocus(){
    timer.phase = "idle";
    cancelAnimationFrame(timer.raf);
    resetFavicon();
    $("focus").classList.remove("show");
  }
  function commitDone(){
    var got = markDone(timer.task, timer.sec);
    closeFocus();
    celebrate(); ding();
    toast(got.length ? ("新成就解锁：" + got.map(function(a){return a.n;}).join("、")) : ("已记录，连续 " + S.streak + " 天"));
  }

  // events
  $("launchBtn").addEventListener("click", startFocus);
  $("taskInput").addEventListener("keydown", function(e){ if(e.key === "Enter") startFocus(); });
  $("quick").addEventListener("click", function(e){
    var b = e.target.closest(".chip"); if(!b) return;
    var chips = $("quick").querySelectorAll(".chip");
    for (var i=0;i<chips.length;i++) chips[i].classList.remove("on");
    b.classList.add("on");
    $("taskInput").value = b.getAttribute("data-v");
  });
  $("taskInput").addEventListener("input", function(){
    var chips = $("quick").querySelectorAll(".chip");
    for (var i=0;i<chips.length;i++) chips[i].classList.remove("on");
  });
  $("doneEarlyBtn").addEventListener("click", function(){ showDone(false); });
  $("giveUpBtn").addEventListener("click", function(){ closeFocus(); toast("没关系，随时可以再来"); });
  $("commitBtn").addEventListener("click", commitDone);
  $("againBtn").addEventListener("click", startFocus);
  $("endBtn").addEventListener("click", function(){ closeFocus(); });

  $("badges").addEventListener("click", function(e){
    var b = e.target.closest(".badge");
    if (!b) return;
    var idx = Array.prototype.indexOf.call($("badges").children, b);
    var a = ACH[idx];
    if (!a) return;
    var on = S.ach.indexOf(a.id) >= 0;
    toast(a.n + " · " + a.d + (on ? "（已解锁）" : "（未解锁）"));
  });

  function syncSound(){ $("soundBtn").textContent = "提示音：" + (S.sound ? "开" : "关"); }
  $("soundBtn").addEventListener("click", function(){
    S.sound = !S.sound; save(); syncSound(); toast(S.sound ? "提示音已开启" : "提示音已关闭");
  });
  var arm = false, armT;
  $("resetBtn").addEventListener("click", function(){
    var b = $("resetBtn");
    if (!arm){
      arm = true; b.textContent = "再点一次确认清空"; b.classList.add("arm");
      armT = setTimeout(function(){ arm = false; b.textContent = "清空数据"; b.classList.remove("arm"); }, 3000);
      return;
    }
    clearTimeout(armT); arm = false; b.textContent = "清空数据"; b.classList.remove("arm");
    S = Object.assign({}, DEF, {today:{date:"",count:0}, history:[], ach:[]});
    save(); render(); syncSound(); toast("已清空，重新开始就好");
  });

  var deferred = null;
  window.addEventListener("beforeinstallprompt", function(e){ e.preventDefault(); deferred = e; $("installBtn").classList.remove("hide"); });
  $("installBtn").addEventListener("click", function(){
    if (!deferred) return;
    deferred.prompt();
    deferred.userChoice.then(function(){ deferred = null; $("installBtn").classList.add("hide"); });
  });

  if ("serviceWorker" in navigator){
    window.addEventListener("load", function(){ navigator.serviceWorker.register("./sw.js").catch(function(){}); });
  }

  var LINES = [
    "拖延的人不缺计划，只缺一个开始。",
    "别等状态好，先做两分钟状态就来了。",
    "做不完没关系，开始了就算赢。",
    "大脑说待会儿，身体先动起来。",
    "两分钟很短，短到没有理由拒绝。"
  ];
  $("lead").textContent = LINES[new Date().getDate() % LINES.length];
  syncSound(); render();
})();
</script>
</body>
</html>
